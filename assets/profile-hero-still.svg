<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Silviu Stroe — Founder and CTO at Brainic</title>
  <desc id="desc">Building intelligence into useful software. A signal moves through a diagram connecting context, tools, evaluation, and delivery.</desc>
