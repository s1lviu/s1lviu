      <stop offset=".5" stop-color="#b8f57a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b8f57a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="18" fill="#0b1116"/>
